<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080706">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Warcraft II">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Warcraft II</title>
  <link rel="manifest" href="./pilot.webmanifest">
  <link rel="apple-touch-icon" href="./art/app-icon.png">
  <link rel="stylesheet" href="./battle.css">
  <link rel="stylesheet" href="./act-interlude.css">
  <link rel="stylesheet" href="./story-ui.css">
  <link rel="stylesheet" href="./finale-ui.css">
  <link rel="stylesheet" href="./results-ui.css">
  <link rel="stylesheet" href="./scene-theme.css">
  <link rel="stylesheet" href="./typography.css">
  <script src="./lib/presentation.js" defer></script>
  <script src="./lib/smooth-camera.js" defer></script>
  <script src="./lib/independent-camera-pilot.js" defer></script>
  <script src="./lib/dune-controls.js" defer></script>
  <script type="module" src="./offline.js"></script>
  <script type="module" src="./battle.js"></script>
</head>
<body>
  <main id="battle" aria-label="Warcraft II battle">
    <canvas id="game" tabindex="0" aria-label="Battlefield"></canvas>
    <header id="hud-top" hidden>
      <div id="resources"></div>
      <button id="menu-button" class="war-button" type="button" aria-label="Menu"></button>
    </header>
    <aside id="selection" aria-label="Selected units" hidden></aside>
    <canvas id="minimap" aria-label="Minimap" hidden></canvas>
    <div id="command-area" hidden>
      <output id="command-detail" hidden></output>
      <div id="commands" aria-label="Commands"></div>
      <div id="placement" hidden>
        <button id="place-button" class="war-button positive" type="button" disabled>Place</button>
        <button id="cancel-placement" class="war-button negative" type="button">Cancel</button>
      </div>
    </div>
    <div id="loading" role="status">
      <p id="loading-text">Loading Warcraft II…</p>
      <progress id="loading-progress"></progress>
      <button id="retry" class="war-button" type="button" hidden>Retry</button>
    </div>
    <section id="front" aria-label="Warcraft II menus" hidden>
      <div class="front-art" aria-hidden="true"></div>
      <img class="front-logo" src="./art/menu/title-logo.webp" alt="Warcraft II">
      <div class="front-panel">
        <h1 class="front-heading" hidden></h1>
        <div class="front-content"></div>
        <footer class="front-footer"></footer>
      </div>
      <button class="war-button front-back" type="button" aria-label="Back" hidden>◀</button>
      <button class="war-button front-update" type="button" hidden>Update</button>
      <button class="war-button front-feedback" type="button" disabled hidden>Feedback</button>
    </section>
    <dialog id="modal" aria-labelledby="modal-title">
      <section id="modal-panel">
        <h1 id="modal-title"></h1>
        <div id="modal-content"></div>
        <div id="modal-actions"></div>
      </section>
      <div id="modal-chrome"></div>
    </dialog>
  </main>
</body>
</html>
